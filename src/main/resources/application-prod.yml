spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources[0]:
            endpoint: ${AZURE_KEY_VAULT_ENDPOINT} #environment variable
  datasource:
    url: ${datasource-url} #secret from key vault
    username: ${datasource-username} #secret from key vault
    password: ${datasource-password} #secret from key vault
  jpa:
    hibernate:
      ddl-auto: none #turn off ddl auto generation
